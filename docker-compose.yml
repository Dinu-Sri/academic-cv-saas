version: '3.8'

services:
  # PHP Application (Apache)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cvscholar-app
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-academic_cv}
      - DB_USER=${DB_USER:-cvscholar}
      - DB_PASS=${DB_PASS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_ANALYTICS_ID=${GOOGLE_ANALYTICS_ID:-}
      - SEARCH_CONSOLE_VERIFICATION=${SEARCH_CONSOLE_VERIFICATION:-}
      - POSTHOG_API_KEY=${POSTHOG_API_KEY:-}
      - POSTHOG_SEND_CLIENT_IP=${POSTHOG_SEND_CLIENT_IP:-false}
      - AI_CV_IMPORT_USE_OPENAI=${AI_CV_IMPORT_USE_OPENAI:-false}
      - AI_CV_IMPORT_REQUIRE_OPENAI_MAPPING=${AI_CV_IMPORT_REQUIRE_OPENAI_MAPPING:-false}
      - AI_CV_IMPORT_TEXT_CHAR_LIMIT=${AI_CV_IMPORT_TEXT_CHAR_LIMIT:-24000}
      - AI_CV_IMPORT_OCR_TEXT_CHAR_LIMIT=${AI_CV_IMPORT_OCR_TEXT_CHAR_LIMIT:-12000}
      - AI_CV_IMPORT_MAX_UPLOAD_MB=${AI_CV_IMPORT_MAX_UPLOAD_MB:-8}
      - AI_CV_IMPORT_OCR_LANG=${AI_CV_IMPORT_OCR_LANG:-eng}
      - AI_CV_IMPORT_API_TIMEOUT=${AI_CV_IMPORT_API_TIMEOUT:-45}
      - AI_CV_IMPORT_OCR_API_TIMEOUT=${AI_CV_IMPORT_OCR_API_TIMEOUT:-25}
      - AI_CV_IMPORT_USE_DOCLING_FOR_OCR=${AI_CV_IMPORT_USE_DOCLING_FOR_OCR:-true}
      - AI_CV_IMPORT_DOCLING_URL=${AI_CV_IMPORT_DOCLING_URL:-http://docling:8085}
      - AI_CV_IMPORT_DOCLING_TIMEOUT=${AI_CV_IMPORT_DOCLING_TIMEOUT:-35}
      - AI_CV_IMPORT_QUEUE_RUNNER=${AI_CV_IMPORT_QUEUE_RUNNER:-1}
      - AI_CV_IMPORT_QUEUE_POLL_SECONDS=${AI_CV_IMPORT_QUEUE_POLL_SECONDS:-10}
      - PHP_UPLOAD_MAX_FILESIZE_MB=${PHP_UPLOAD_MAX_FILESIZE_MB:-16}
      - PHP_POST_MAX_SIZE_MB=${PHP_POST_MAX_SIZE_MB:-20}
      - PHP_MEMORY_LIMIT_MB=${PHP_MEMORY_LIMIT_MB:-256}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_CV_IMPORT_MODEL=${OPENAI_CV_IMPORT_MODEL:-gpt-4.1-nano}
    ports:
      - "8080:80"
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      docling:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cv-network

  # Docling OCR/structured extraction sidecar
  docling:
    build:
      context: ./services/docling
      dockerfile: Dockerfile
    container_name: cvscholar-docling
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8085/healthz', timeout=8); sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 120s
    restart: unless-stopped
    networks:
      - cv-network

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: cvscholar-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-academic_cv}
      MYSQL_USER: ${MYSQL_USER:-cvscholar}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    networks:
      - cv-network

  # phpMyAdmin (optional, for DB management)
  phpmyadmin:
    image: phpmyadmin:5
    container_name: cvscholar-pma
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "8082:80"
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - cv-network

  # Cloudflare Tunnel (connects domain to app without exposing ports)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cvscholar-tunnel
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - cv-network

volumes:
  mysql_data:
    driver: local
  app_storage:
    driver: local

networks:
  cv-network:
    driver: bridge
