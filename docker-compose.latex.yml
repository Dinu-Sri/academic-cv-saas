# docker-compose.latex.yml
#
# Compose override for the LaTeX-enabled CVScholar build. Use it alongside the
# main file:
#
#   docker compose -f docker-compose.yml -f docker-compose.latex.yml up -d --build
#
# In Portainer, deploy this as a separate stack pointing at Dockerfile.latex.
# Both stacks can run in parallel during the dark-launch period; route a small
# subset of traffic / a single template to the LaTeX stack first.
#
# Environment-only delta:
#   - dockerfile is swapped to Dockerfile.latex
#   - container_name suffixed with -latex so both stacks coexist on one host
#   - CVSCHOLAR_LATEX_ENABLED=1 enables the entrypoint smoke test

version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.latex
    container_name: cvscholar-app-latex
    environment:
      - CVSCHOLAR_LATEX_ENABLED=1
    # All other env vars and volumes are inherited from docker-compose.yml.
