version: '3.8'

services:
  rewrite-db:
    image: postgres:16-alpine
    container_name: cvscholar-rewrite-db
    environment:
      - POSTGRES_DB=${REWRITE_DB_NAME:-cvscholar_rewrite}
      - POSTGRES_USER=${REWRITE_DB_USER:-cvscholar_rewrite}
      - POSTGRES_PASSWORD=${REWRITE_DB_PASSWORD:?Set REWRITE_DB_PASSWORD for rewrite staging}
    volumes:
      - rewrite_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${REWRITE_DB_USER:-cvscholar_rewrite} -d ${REWRITE_DB_NAME:-cvscholar_rewrite}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cvscholar-rewrite-network

  rewrite-redis:
    image: redis:7-alpine
    container_name: cvscholar-rewrite-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - rewrite_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cvscholar-rewrite-network

  rewrite-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL for rewrite staging}
        DATABASE_URL: postgresql://build:build@localhost:5432/build?schema=public
        BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL for rewrite staging}
        BETTER_AUTH_SECRET: build-time-placeholder-secret-for-ci-only
    container_name: cvscholar-rewrite-web
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL for rewrite staging}
      - DATABASE_URL=postgresql://${REWRITE_DB_USER:-cvscholar_rewrite}:${REWRITE_DB_PASSWORD:?Set REWRITE_DB_PASSWORD for rewrite staging}@rewrite-db:5432/${REWRITE_DB_NAME:-cvscholar_rewrite}?schema=public
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:?Set BETTER_AUTH_URL for rewrite staging}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET for rewrite staging}
      - REDIS_URL=redis://rewrite-redis:6379
      - CVSCHOLAR_FILE_STORAGE_DIR=/app/storage
      - CVSCHOLAR_CV_IMPORT_MAX_UPLOAD_MB=${CVSCHOLAR_CV_IMPORT_MAX_UPLOAD_MB:-8}
      - NEXT_PUBLIC_CV_IMPORT_MAX_UPLOAD_MB=${CVSCHOLAR_CV_IMPORT_MAX_UPLOAD_MB:-8}
      - CVSCHOLAR_CV_AGENT_MODEL=${CVSCHOLAR_CV_AGENT_MODEL:-gpt-4.1-nano}
      - CVSCHOLAR_CV_AGENT_TIMEOUT_MS=${CVSCHOLAR_CV_AGENT_TIMEOUT_MS:-45000}
      - CVSCHOLAR_CV_AGENT_MAX_UPLOAD_MB=${CVSCHOLAR_CV_AGENT_MAX_UPLOAD_MB:-10}
      - CVSCHOLAR_CV_POLISH_MODEL=${CVSCHOLAR_CV_POLISH_MODEL:-gpt-4.1-mini}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_PRIVATE_BUCKET=${R2_PRIVATE_BUCKET:-}
      - PORT=3000
      - HOSTNAME=0.0.0.0
    ports:
      - "${REWRITE_WEB_PORT:-3240}:3000"
    volumes:
      - rewrite_file_storage:/app/storage
    depends_on:
      rewrite-db:
        condition: service_healthy
      rewrite-redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cvscholar-rewrite-network

  rewrite-pdf-worker:
    build:
      context: .
      dockerfile: apps/pdf-worker/Dockerfile
      args:
        DATABASE_URL: postgresql://build:build@localhost:5432/build?schema=public
    container_name: cvscholar-rewrite-pdf-worker
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${REWRITE_DB_USER:-cvscholar_rewrite}:${REWRITE_DB_PASSWORD:?Set REWRITE_DB_PASSWORD for rewrite staging}@rewrite-db:5432/${REWRITE_DB_NAME:-cvscholar_rewrite}?schema=public
      - REDIS_URL=redis://rewrite-redis:6379
      - PDF_WORKER_CONCURRENCY=${PDF_WORKER_CONCURRENCY:-1}
      - CVSCHOLAR_FILE_STORAGE_DIR=/app/storage
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_PRIVATE_BUCKET=${R2_PRIVATE_BUCKET:-}
    volumes:
      - rewrite_file_storage:/app/storage
    depends_on:
      rewrite-db:
        condition: service_healthy
      rewrite-redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cvscholar-rewrite-network

  rewrite-import-worker:
    build:
      context: .
      dockerfile: apps/pdf-worker/Dockerfile
      args:
        DATABASE_URL: postgresql://build:build@localhost:5432/build?schema=public
    container_name: cvscholar-rewrite-import-worker
    command: ["pnpm", "--filter", "@cvscholar/pdf-worker", "import:start"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${REWRITE_DB_USER:-cvscholar_rewrite}:${REWRITE_DB_PASSWORD:?Set REWRITE_DB_PASSWORD for rewrite staging}@rewrite-db:5432/${REWRITE_DB_NAME:-cvscholar_rewrite}?schema=public
      - REDIS_URL=redis://rewrite-redis:6379
      - CVSCHOLAR_FILE_STORAGE_DIR=/app/storage
      - CVSCHOLAR_CV_IMPORT_WORKER_CONCURRENCY=${CVSCHOLAR_CV_IMPORT_WORKER_CONCURRENCY:-1}
      - CVSCHOLAR_CV_IMPORT_MAX_UPLOAD_MB=${CVSCHOLAR_CV_IMPORT_MAX_UPLOAD_MB:-8}
      - CVSCHOLAR_CV_IMPORT_PAGE_LIMIT=${CVSCHOLAR_CV_IMPORT_PAGE_LIMIT:-10}
      - CVSCHOLAR_CV_IMPORT_TIMEOUT_MS=${CVSCHOLAR_CV_IMPORT_TIMEOUT_MS:-90000}
      - CVSCHOLAR_CV_IMPORT_MODEL=${CVSCHOLAR_CV_IMPORT_MODEL:-gpt-5.4-mini}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_PRIVATE_BUCKET=${R2_PRIVATE_BUCKET:-}
    volumes:
      - rewrite_file_storage:/app/storage
    depends_on:
      rewrite-db:
        condition: service_healthy
      rewrite-redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cvscholar-rewrite-network

  rewrite-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cvscholar-rewrite-tunnel
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CF_REWRITE_TUNNEL_TOKEN:?Set CF_REWRITE_TUNNEL_TOKEN for rewrite staging}
    depends_on:
      - rewrite-web
    restart: unless-stopped
    networks:
      - cvscholar-rewrite-network

networks:
  cvscholar-rewrite-network:
    driver: bridge

volumes:
  rewrite_pg_data:
    driver: local
  rewrite_redis_data:
    driver: local
  rewrite_file_storage:
    driver: local
