version: '3.8'

services:
  rewrite-db:
    image: postgres:16-alpine
    container_name: cvscholar-rewrite-db
    environment:
      - POSTGRES_DB=${REWRITE_DB_NAME:-cvscholar_rewrite}
      - POSTGRES_USER=${REWRITE_DB_USER:-cvscholar_rewrite}
      - POSTGRES_PASSWORD=${REWRITE_DB_PASSWORD:?Set REWRITE_DB_PASSWORD for rewrite staging}
    volumes:
      - rewrite_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${REWRITE_DB_USER:-cvscholar_rewrite} -d ${REWRITE_DB_NAME:-cvscholar_rewrite}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cvscholar-rewrite-network

  rewrite-redis:
    image: redis:7-alpine
    container_name: cvscholar-rewrite-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - rewrite_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cvscholar-rewrite-network

  rewrite-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL for rewrite staging}
        DATABASE_URL: postgresql://build:build@localhost:5432/build?schema=public
        BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL for rewrite staging}
        BETTER_AUTH_SECRET: build-time-placeholder-secret-for-ci-only
    container_name: cvscholar-rewrite-web
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL for rewrite staging}
      - DATABASE_URL=postgresql://${REWRITE_DB_USER:-cvscholar_rewrite}:${REWRITE_DB_PASSWORD:?Set REWRITE_DB_PASSWORD for rewrite staging}@rewrite-db:5432/${REWRITE_DB_NAME:-cvscholar_rewrite}?schema=public
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:?Set BETTER_AUTH_URL for rewrite staging}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET for rewrite staging}
      - CVSCHOLAR_ADMIN_EMAILS=${CVSCHOLAR_ADMIN_EMAILS:-}
      - REDIS_URL=redis://rewrite-redis:6379
      - CVSCHOLAR_FILE_STORAGE_DIR=/app/storage
      - CVSCHOLAR_CV_IMPORT_MAX_UPLOAD_MB=${CVSCHOLAR_CV_IMPORT_MAX_UPLOAD_MB:-8}
      - NEXT_PUBLIC_CV_IMPORT_MAX_UPLOAD_MB=${CVSCHOLAR_CV_IMPORT_MAX_UPLOAD_MB:-8}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-pro}
      - DEEPSEEK_REASONING_EFFORT=${DEEPSEEK_REASONING_EFFORT:-max}
      - CVSCHOLAR_CV_AGENT_TIMEOUT_MS=${CVSCHOLAR_CV_AGENT_TIMEOUT_MS:-45000}
      - CVSCHOLAR_CV_AGENT_MAX_UPLOAD_MB=${CVSCHOLAR_CV_AGENT_MAX_UPLOAD_MB:-10}
      - CVSCHOLAR_AGENT_RUNS_ENABLED=${CVSCHOLAR_AGENT_RUNS_ENABLED:-1}
      - CVSCHOLAR_AGENT_WORKER_ENABLED=${CVSCHOLAR_AGENT_WORKER_ENABLED:-1}
      - CVSCHOLAR_AGENT_MAX_TOOL_STEPS=${CVSCHOLAR_AGENT_MAX_TOOL_STEPS:-4}
      - CVSCHOLAR_AGENT_ADVANCED_TOOLS_ENABLED=${CVSCHOLAR_AGENT_ADVANCED_TOOLS_ENABLED:-1}
      - CVSCHOLAR_AGENT_RETRIEVAL_ENABLED=${CVSCHOLAR_AGENT_RETRIEVAL_ENABLED:-1}
      - CVSCHOLAR_AGENT_MEMORY_ENABLED=${CVSCHOLAR_AGENT_MEMORY_ENABLED:-1}
      - CVSCHOLAR_AGENT_RECENT_MESSAGE_WINDOW=${CVSCHOLAR_AGENT_RECENT_MESSAGE_WINDOW:-16}
      - CVSCHOLAR_AGENT_CONTEXT_TOKEN_LIMIT=${CVSCHOLAR_AGENT_CONTEXT_TOKEN_LIMIT:-6000}
      - CVSCHOLAR_AGENT_THREAD_MESSAGE_LIMIT=${CVSCHOLAR_AGENT_THREAD_MESSAGE_LIMIT:-80}
      - CVSCHOLAR_AGENT_ROLLOVER_COMPACTIONS=${CVSCHOLAR_AGENT_ROLLOVER_COMPACTIONS:-3}
      - CVSCHOLAR_AGENT_REASONING_MODEL=${CVSCHOLAR_AGENT_REASONING_MODEL:-deepseek-v4-pro}
      - CVSCHOLAR_AGENT_WRITING_MODEL=${CVSCHOLAR_AGENT_WRITING_MODEL:-gpt-4.1-mini}
      - CVSCHOLAR_AGENT_CLASSIFICATION_MODEL=${CVSCHOLAR_AGENT_CLASSIFICATION_MODEL:-deepseek-v4-pro}
      - CVSCHOLAR_AGENT_VALIDATION_MODEL=${CVSCHOLAR_AGENT_VALIDATION_MODEL:-deepseek-v4-pro}
      - CVSCHOLAR_AGENT_PLANNER_ENABLED=${CVSCHOLAR_AGENT_PLANNER_ENABLED:-1}
      - CVSCHOLAR_AGENT_PLANNER_MODEL=${CVSCHOLAR_AGENT_PLANNER_MODEL:-deepseek-v4-pro}
      - CVSCHOLAR_AGENT_PLANNER_TIMEOUT_MS=${CVSCHOLAR_AGENT_PLANNER_TIMEOUT_MS:-20000}
      - CVSCHOLAR_AGENT_PLANNER_MAX_JOBS=${CVSCHOLAR_AGENT_PLANNER_MAX_JOBS:-3}
      - CVSCHOLAR_AGENT_PLANNER_LOW_CONFIDENCE=${CVSCHOLAR_AGENT_PLANNER_LOW_CONFIDENCE:-0.5}
      - CVSCHOLAR_WEBSITE_ENABLED=${CVSCHOLAR_WEBSITE_ENABLED:-1}
      - CVSCHOLAR_WEBSITE_ROOT_DOMAIN=${CVSCHOLAR_WEBSITE_ROOT_DOMAIN:-cvscholar.com}
      - NEXT_PUBLIC_WEBSITE_ROOT_DOMAIN=${NEXT_PUBLIC_WEBSITE_ROOT_DOMAIN:-cvscholar.com}
      - CVSCHOLAR_WEBSITE_PUBLISH_ENABLED=${CVSCHOLAR_WEBSITE_PUBLISH_ENABLED:-1}
      - CVSCHOLAR_WEBSITE_WORKER_ENABLED=${CVSCHOLAR_WEBSITE_WORKER_ENABLED:-1}
      - CVSCHOLAR_WEBSITE_SUBDOMAIN_ENABLED=${CVSCHOLAR_WEBSITE_SUBDOMAIN_ENABLED:-1}
      - CVSCHOLAR_WEBSITE_CONTACT_ENABLED=${CVSCHOLAR_WEBSITE_CONTACT_ENABLED:-1}
      - CVSCHOLAR_WEBSITE_CONTACT_RATE_LIMIT_HOURLY=${CVSCHOLAR_WEBSITE_CONTACT_RATE_LIMIT_HOURLY:-5}
      - CVSCHOLAR_WEBSITE_CONTACT_RATE_LIMIT_DAILY=${CVSCHOLAR_WEBSITE_CONTACT_RATE_LIMIT_DAILY:-20}
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-CVScholar <noreply@cvscholar.com>}
      - SUPPORT_EMAIL=${SUPPORT_EMAIL:-}
      - CVSCHOLAR_SUPPORT_EMAIL=${CVSCHOLAR_SUPPORT_EMAIL:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN:-}
      - REDIS_URL=redis://rewrite-redis:6379
      - CVSCHOLAR_AGENT_INPUT_COST_PER_MILLION_CENTS=${CVSCHOLAR_AGENT_INPUT_COST_PER_MILLION_CENTS:-0}
      - CVSCHOLAR_AGENT_OUTPUT_COST_PER_MILLION_CENTS=${CVSCHOLAR_AGENT_OUTPUT_COST_PER_MILLION_CENTS:-0}
      - CVSCHOLAR_ATTACHMENT_EXTRACT_WORKER_CONCURRENCY=${CVSCHOLAR_ATTACHMENT_EXTRACT_WORKER_CONCURRENCY:-1}
      - CVSCHOLAR_CV_POLISH_MODEL=${CVSCHOLAR_CV_POLISH_MODEL:-gpt-4.1-mini}
      - CVSCHOLAR_DOCUMENT_EXTRACT_MODEL=${CVSCHOLAR_DOCUMENT_EXTRACT_MODEL:-gpt-5.4-mini}
      - CVSCHOLAR_ATTACHMENT_EXTRACT_TIMEOUT_MS=${CVSCHOLAR_ATTACHMENT_EXTRACT_TIMEOUT_MS:-90000}
      - CVSCHOLAR_BILLING_PDF_PASS_USD=${CVSCHOLAR_BILLING_PDF_PASS_USD:-5}
      - CVSCHOLAR_BILLING_SCHOLAR_ANNUAL_USD=${CVSCHOLAR_BILLING_SCHOLAR_ANNUAL_USD:-36}
      - CVSCHOLAR_BILLING_DEV_SIMULATE=${CVSCHOLAR_BILLING_DEV_SIMULATE:-0}
      - PAYHERE_MERCHANT_ID=${PAYHERE_MERCHANT_ID:-}
      - PAYHERE_MERCHANT_SECRET=${PAYHERE_MERCHANT_SECRET:-}
      - PAYHERE_CURRENCY=${PAYHERE_CURRENCY:-USD}
      - PAYHERE_SANDBOX=${PAYHERE_SANDBOX:-1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_PRIVATE_BUCKET=${R2_PRIVATE_BUCKET:-}
      - PORT=3000
      - HOSTNAME=0.0.0.0
    ports:
      - "${REWRITE_WEB_PORT:-3240}:3000"
    volumes:
      - rewrite_file_storage:/app/storage
    depends_on:
      rewrite-db:
        condition: service_healthy
      rewrite-redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cvscholar-rewrite-network

  rewrite-pdf-worker:
    build:
      context: .
      dockerfile: apps/pdf-worker/Dockerfile
      args:
        DATABASE_URL: postgresql://build:build@localhost:5432/build?schema=public
    container_name: cvscholar-rewrite-pdf-worker
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${REWRITE_DB_USER:-cvscholar_rewrite}:${REWRITE_DB_PASSWORD:?Set REWRITE_DB_PASSWORD for rewrite staging}@rewrite-db:5432/${REWRITE_DB_NAME:-cvscholar_rewrite}?schema=public
      - REDIS_URL=redis://rewrite-redis:6379
      - PDF_WORKER_CONCURRENCY=${PDF_WORKER_CONCURRENCY:-1}
      - CVSCHOLAR_FILE_STORAGE_DIR=/app/storage
      - CVSCHOLAR_CV_SVG_PREVIEW_CONCURRENCY=${CVSCHOLAR_CV_SVG_PREVIEW_CONCURRENCY:-2}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_PRIVATE_BUCKET=${R2_PRIVATE_BUCKET:-}
    volumes:
      - rewrite_file_storage:/app/storage
    depends_on:
      rewrite-db:
        condition: service_healthy
      rewrite-redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cvscholar-rewrite-network

  rewrite-import-worker:
    build:
      context: .
      dockerfile: apps/pdf-worker/Dockerfile
      args:
        DATABASE_URL: postgresql://build:build@localhost:5432/build?schema=public
    container_name: cvscholar-rewrite-import-worker
    command: ["pnpm", "--filter", "@cvscholar/pdf-worker", "import:start"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${REWRITE_DB_USER:-cvscholar_rewrite}:${REWRITE_DB_PASSWORD:?Set REWRITE_DB_PASSWORD for rewrite staging}@rewrite-db:5432/${REWRITE_DB_NAME:-cvscholar_rewrite}?schema=public
      - REDIS_URL=redis://rewrite-redis:6379
      - CVSCHOLAR_FILE_STORAGE_DIR=/app/storage
      - CVSCHOLAR_CV_IMPORT_WORKER_CONCURRENCY=${CVSCHOLAR_CV_IMPORT_WORKER_CONCURRENCY:-1}
      - CVSCHOLAR_CV_IMPORT_MAX_UPLOAD_MB=${CVSCHOLAR_CV_IMPORT_MAX_UPLOAD_MB:-8}
      - CVSCHOLAR_CV_IMPORT_PAGE_LIMIT=${CVSCHOLAR_CV_IMPORT_PAGE_LIMIT:-10}
      - CVSCHOLAR_CV_IMPORT_TIMEOUT_MS=${CVSCHOLAR_CV_IMPORT_TIMEOUT_MS:-90000}
      - CVSCHOLAR_CV_IMPORT_MODEL=${CVSCHOLAR_CV_IMPORT_MODEL:-gpt-5.4-mini}
      - CVSCHOLAR_DOCUMENT_EXTRACT_MODEL=${CVSCHOLAR_DOCUMENT_EXTRACT_MODEL:-gpt-5.4-mini}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-pro}
      - DEEPSEEK_REASONING_EFFORT=${DEEPSEEK_REASONING_EFFORT:-max}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_PRIVATE_BUCKET=${R2_PRIVATE_BUCKET:-}
    volumes:
      - rewrite_file_storage:/app/storage
    depends_on:
      rewrite-db:
        condition: service_healthy
      rewrite-redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cvscholar-rewrite-network

  rewrite-agent-attachment-worker:
    build:
      context: .
      dockerfile: apps/pdf-worker/Dockerfile
      args:
        DATABASE_URL: postgresql://build:build@localhost:5432/build?schema=public
    container_name: cvscholar-rewrite-agent-attachment-worker
    command: ["pnpm", "--filter", "@cvscholar/pdf-worker", "agent-attachments:start"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${REWRITE_DB_USER:-cvscholar_rewrite}:${REWRITE_DB_PASSWORD:?Set REWRITE_DB_PASSWORD for rewrite staging}@rewrite-db:5432/${REWRITE_DB_NAME:-cvscholar_rewrite}?schema=public
      - REDIS_URL=redis://rewrite-redis:6379
      - CVSCHOLAR_FILE_STORAGE_DIR=/app/storage
      - CVSCHOLAR_ATTACHMENT_EXTRACT_WORKER_CONCURRENCY=${CVSCHOLAR_ATTACHMENT_EXTRACT_WORKER_CONCURRENCY:-1}
      - CVSCHOLAR_ATTACHMENT_EXTRACT_TIMEOUT_MS=${CVSCHOLAR_ATTACHMENT_EXTRACT_TIMEOUT_MS:-90000}
      - CVSCHOLAR_DOCUMENT_EXTRACT_MODEL=${CVSCHOLAR_DOCUMENT_EXTRACT_MODEL:-gpt-5.4-mini}
      - CVSCHOLAR_CV_IMPORT_MODEL=${CVSCHOLAR_CV_IMPORT_MODEL:-gpt-5.4-mini}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_PRIVATE_BUCKET=${R2_PRIVATE_BUCKET:-}
    volumes:
      - rewrite_file_storage:/app/storage
    depends_on:
      rewrite-db:
        condition: service_healthy
      rewrite-redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cvscholar-rewrite-network

  rewrite-website-worker:
    build:
      context: .
      dockerfile: apps/website-worker/Dockerfile
      args:
        DATABASE_URL: postgresql://build:build@localhost:5432/build?schema=public
    container_name: cvscholar-rewrite-website-worker
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${REWRITE_DB_USER:-cvscholar_rewrite}:${REWRITE_DB_PASSWORD:?Set REWRITE_DB_PASSWORD for rewrite staging}@rewrite-db:5432/${REWRITE_DB_NAME:-cvscholar_rewrite}?schema=public
      - REDIS_URL=redis://rewrite-redis:6379
      - WEBSITE_PUBLISH_WORKER_CONCURRENCY=${WEBSITE_PUBLISH_WORKER_CONCURRENCY:-1}
      - CVSCHOLAR_WEBSITE_ENABLED=${CVSCHOLAR_WEBSITE_ENABLED:-1}
      - CVSCHOLAR_WEBSITE_PUBLISH_ENABLED=${CVSCHOLAR_WEBSITE_PUBLISH_ENABLED:-1}
      - CVSCHOLAR_WEBSITE_WORKER_ENABLED=${CVSCHOLAR_WEBSITE_WORKER_ENABLED:-1}
      - NEXT_PUBLIC_WEBSITE_ROOT_DOMAIN=${NEXT_PUBLIC_WEBSITE_ROOT_DOMAIN:-cvscholar.com}
      - CVSCHOLAR_WEBSITE_ROOT_DOMAIN=${CVSCHOLAR_WEBSITE_ROOT_DOMAIN:-cvscholar.com}
    depends_on:
      rewrite-db:
        condition: service_healthy
      rewrite-redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cvscholar-rewrite-network

  rewrite-agent-worker:
    build:
      context: .
      dockerfile: apps/agent-worker/Dockerfile
      args:
        DATABASE_URL: postgresql://build:build@localhost:5432/build?schema=public
    container_name: cvscholar-rewrite-agent-worker
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${REWRITE_DB_USER:-cvscholar_rewrite}:${REWRITE_DB_PASSWORD:?Set REWRITE_DB_PASSWORD for rewrite staging}@rewrite-db:5432/${REWRITE_DB_NAME:-cvscholar_rewrite}?schema=public
      - REDIS_URL=redis://rewrite-redis:6379
      - CVSCHOLAR_AGENT_WORKER_CONCURRENCY=${CVSCHOLAR_AGENT_WORKER_CONCURRENCY:-1}
      - CVSCHOLAR_AGENT_MAX_TOOL_STEPS=${CVSCHOLAR_AGENT_MAX_TOOL_STEPS:-4}
      - CVSCHOLAR_AGENT_ADVANCED_TOOLS_ENABLED=${CVSCHOLAR_AGENT_ADVANCED_TOOLS_ENABLED:-1}
      - CVSCHOLAR_AGENT_RETRIEVAL_ENABLED=${CVSCHOLAR_AGENT_RETRIEVAL_ENABLED:-1}
      - CVSCHOLAR_AGENT_MEMORY_ENABLED=${CVSCHOLAR_AGENT_MEMORY_ENABLED:-1}
      - CVSCHOLAR_AGENT_RECENT_MESSAGE_WINDOW=${CVSCHOLAR_AGENT_RECENT_MESSAGE_WINDOW:-16}
      - CVSCHOLAR_AGENT_CONTEXT_TOKEN_LIMIT=${CVSCHOLAR_AGENT_CONTEXT_TOKEN_LIMIT:-6000}
      - CVSCHOLAR_AGENT_THREAD_MESSAGE_LIMIT=${CVSCHOLAR_AGENT_THREAD_MESSAGE_LIMIT:-80}
      - CVSCHOLAR_AGENT_ROLLOVER_COMPACTIONS=${CVSCHOLAR_AGENT_ROLLOVER_COMPACTIONS:-3}
      - CVSCHOLAR_CV_AGENT_TIMEOUT_MS=${CVSCHOLAR_CV_AGENT_TIMEOUT_MS:-45000}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-pro}
      - DEEPSEEK_REASONING_EFFORT=${DEEPSEEK_REASONING_EFFORT:-max}
      - CVSCHOLAR_AGENT_REASONING_MODEL=${CVSCHOLAR_AGENT_REASONING_MODEL:-deepseek-v4-pro}
      - CVSCHOLAR_AGENT_WRITING_MODEL=${CVSCHOLAR_AGENT_WRITING_MODEL:-gpt-4.1-mini}
      - CVSCHOLAR_AGENT_CLASSIFICATION_MODEL=${CVSCHOLAR_AGENT_CLASSIFICATION_MODEL:-deepseek-v4-pro}
      - CVSCHOLAR_AGENT_VALIDATION_MODEL=${CVSCHOLAR_AGENT_VALIDATION_MODEL:-deepseek-v4-pro}
      - CVSCHOLAR_AGENT_PLANNER_ENABLED=${CVSCHOLAR_AGENT_PLANNER_ENABLED:-1}
      - CVSCHOLAR_AGENT_PLANNER_MODEL=${CVSCHOLAR_AGENT_PLANNER_MODEL:-deepseek-v4-pro}
      - CVSCHOLAR_AGENT_PLANNER_TIMEOUT_MS=${CVSCHOLAR_AGENT_PLANNER_TIMEOUT_MS:-20000}
      - CVSCHOLAR_AGENT_PLANNER_MAX_JOBS=${CVSCHOLAR_AGENT_PLANNER_MAX_JOBS:-3}
      - CVSCHOLAR_AGENT_PLANNER_LOW_CONFIDENCE=${CVSCHOLAR_AGENT_PLANNER_LOW_CONFIDENCE:-0.5}
      - CVSCHOLAR_AGENT_INPUT_COST_PER_MILLION_CENTS=${CVSCHOLAR_AGENT_INPUT_COST_PER_MILLION_CENTS:-0}
      - CVSCHOLAR_AGENT_OUTPUT_COST_PER_MILLION_CENTS=${CVSCHOLAR_AGENT_OUTPUT_COST_PER_MILLION_CENTS:-0}
    depends_on:
      rewrite-db:
        condition: service_healthy
      rewrite-redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cvscholar-rewrite-network

  rewrite-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cvscholar-rewrite-tunnel
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CF_REWRITE_TUNNEL_TOKEN:?Set CF_REWRITE_TUNNEL_TOKEN for rewrite staging}
    depends_on:
      - rewrite-web
    restart: unless-stopped
    networks:
      - cvscholar-rewrite-network

networks:
  cvscholar-rewrite-network:
    driver: bridge

volumes:
  rewrite_pg_data:
    driver: local
  rewrite_redis_data:
    driver: local
  rewrite_file_storage:
    driver: local
